name: WRISTO CI/CD Quality & Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================================
  # 1. Backend CI: Spring Boot 3.3.4 + Java 21 Tests & Flyway Validation
  # ============================================================================
  backend-ci:
    name: Backend Test Suite (Java 21 / Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit & Integration Tests
        working-directory: ./wristo-backend
        run: mvn clean test -B

  # ============================================================================
  # 2. Frontend CI: Next.js 16+ App Router Build & TypeScript Validation
  # ============================================================================
  frontend-ci:
    name: Frontend Production Build (Next.js / TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './wristo-next/package-lock.json'

      - name: Install Dependencies
        working-directory: ./wristo-next
        run: npm ci

      - name: Build Next.js Production Bundle
        working-directory: ./wristo-next
        run: npm run build
